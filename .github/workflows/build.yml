# Every push: make sure the Windows app still compiles.
# On demand (Actions → build → Run workflow): also build the macOS app on GitHub's Macs and
# attach it to the run as a download. It's signed with Vox2's own self-made certificate (repo
# secrets APPLE_CERTIFICATE / _PASSWORD / APPLE_SIGNING_IDENTITY), not an Apple-issued one, so
# macOS still asks you to allow it once (System Settings → Privacy & Security → Open Anyway).
# What the signature buys: every build counts as the same app, so permissions like
# Accessibility and Screen Recording stay granted across updates.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --release --locked

  macos:
    name: macOS app (unsigned)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Trust the signing certificate on this runner
        # It's self-made, so codesign only accepts it once this machine trusts it for signing.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/vox2.p12"
          openssl pkcs12 -in "$RUNNER_TEMP/vox2.p12" -passin env:APPLE_CERTIFICATE_PASSWORD -nokeys -legacy -out "$RUNNER_TEMP/vox2.pem" \
            || openssl pkcs12 -in "$RUNNER_TEMP/vox2.p12" -passin env:APPLE_CERTIFICATE_PASSWORD -nokeys -out "$RUNNER_TEMP/vox2.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/vox2.pem"
          rm "$RUNNER_TEMP/vox2.p12"
      - name: Build
        # Release signing keys stay on Chris's PC, so skip the updater files here. Hardened
        # runtime is only needed for Apple notarization, and would block the mic without extra
        # entitlements, so it stays off.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: npx --yes @tauri-apps/cli@2 build --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":false,"macOS":{"hardenedRuntime":false}}}'
      - name: Check the signature
        # Fail rather than hand out an app that would lose its permissions on the next update.
        run: |
          app=src-tauri/target/release/bundle/macos/Vox2.app
          codesign --verify --deep --strict "$app"
          codesign -dvv "$app" 2>&1 | grep -E "Identifier=|Authority="
          codesign -d -r- "$app"
          codesign -dvv "$app" 2>&1 | grep -q "Authority=Vox2 Self-Signed"
      - uses: actions/upload-artifact@v7
        with:
          name: Vox2-macOS-unsigned
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
