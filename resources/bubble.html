<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vox2 quick translate</title>
  <style>
    @font-face { font-family: "Roboto Mono"; font-weight: 100 700; src: url(fonts/roboto-mono-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: "Roboto Mono"; font-weight: 100 700; src: url(fonts/roboto-mono-latin-ext.woff2) format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    @font-face { font-family: "Roboto Mono"; font-weight: 100 700; src: url(fonts/roboto-mono-vietnamese.woff2) format("woff2"); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
    :root { --bg: #1d1d1d; --ink: #ececea; --muted: #8b8b87; --pending: #66665f; --line: #2f2f2c; --accent: #7aa5ff; --danger: #fb923c; --font: "Roboto Mono", ui-monospace, monospace; }
    html, body { margin: 0; background: transparent; overflow: hidden; }
    body { font: 13px/1.45 var(--font); color: var(--ink); padding: 6px; }
    .card {
      background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .28); display: grid; gap: 6px;
    }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
    .langs { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .src { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    .out { font-size: 15px; line-height: 1.5; max-height: 220px; overflow-y: auto; overflow-wrap: anywhere; white-space: pre-wrap; }
    .out.pending, .out .pending { color: var(--pending); }
    .out.error { color: var(--danger); font-size: 13px; }
    .roman { font-size: 12px; color: var(--muted); font-style: italic; }
    .roman:empty { display: none; }
    .actions { display: flex; gap: 2px; justify-content: flex-end; border-top: 1px solid var(--line); padding-top: 6px; }
    button { font: inherit; color: var(--muted); background: none; border: 0; cursor: pointer; border-radius: 6px; padding: 4px 8px; font-size: 12px; display: inline-flex; gap: 5px; align-items: center; }
    button:hover, button:focus-visible { background: var(--line); color: var(--ink); outline: none; }
    button svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .close { padding: 2px; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="top">
      <span class="langs" id="langs">translating…</span>
      <button class="close" id="close" title="Close (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="src" id="src"></div>
    <div class="out pending" id="out">…</div>
    <div class="roman" id="roman"></div>
    <div class="actions">
      <button id="speak" title="Read aloud"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>listen</button>
      <button id="copy" title="Copy the translation"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>copy</button>
      <button id="open" title="Open in Vox2"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>open in Vox2</button>
    </div>
  </div>
  <script>
    // A small card next to the cursor. The main window does the translating and sends updates:
    // { session, colors?, langs?, source?, translation?, done?, roman?, error?, status? }
    const T = window.__TAURI__;
    const $ = (id) => document.getElementById(id);
    const card = $('card');
    let session = 0;
    let lastHeight = 0;
    let shown = false;

    function place() {
      const h = Math.ceil(card.getBoundingClientRect().height) + 12;
      if (shown && Math.abs(h - lastHeight) < 4) return;
      lastHeight = h;
      shown = true;
      T.core.invoke('place_bubble', { height: h });
    }
    new ResizeObserver(() => { if (shown) place(); }).observe(card);

    function hide() {
      shown = false;
      T.core.invoke('hide_bubble');
    }

    T.event.listen('bubble', ({ payload: p }) => {
      if (p.session < session) return;
      if (p.session > session) { // new quick translation: reset
        session = p.session;
        shown = false;
        $('src').textContent = ''; $('roman').textContent = '';
        $('out').textContent = '…'; $('out').className = 'out pending';
      }
      if (p.colors) for (const [k, v] of Object.entries(p.colors)) document.documentElement.style.setProperty(`--${k}`, v);
      if (p.status) $('langs').textContent = p.status;
      if (p.langs) $('langs').textContent = p.langs;
      if (p.source != null) $('src').textContent = p.source;
      if (p.translation != null) { $('out').textContent = p.translation || '…'; $('out').className = p.done ? 'out' : 'out pending'; }
      if (p.roman != null) $('roman').textContent = p.roman;
      if (p.error) { $('out').textContent = p.error; $('out').className = 'out error'; }
      requestAnimationFrame(place);
    });

    const act = (action) => T.event.emitTo('main', 'bubble-action', { action });
    $('speak').addEventListener('click', () => act('speak'));
    $('open').addEventListener('click', () => { act('open'); hide(); });
    $('close').addEventListener('click', hide);
    $('copy').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText($('out').textContent); } catch {}
      $('copy').lastChild.textContent = 'copied';
      setTimeout(() => { $('copy').lastChild.textContent = 'copy'; }, 900);
    });
    addEventListener('keydown', (e) => { if (e.key === 'Escape') hide(); });
    addEventListener('blur', () => { if (shown) hide(); }); // click anywhere else and it goes away
    T.event.emitTo('main', 'bubble-ready');
  </script>
</body>
</html>
