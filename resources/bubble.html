<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vox2 quick translate</title>
  <style>
    @font-face { font-family: "Roboto Mono"; font-weight: 100 700; src: url(fonts/roboto-mono-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: "Roboto Mono"; font-weight: 100 700; src: url(fonts/roboto-mono-latin-ext.woff2) format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    @font-face { font-family: "Roboto Mono"; font-weight: 100 700; src: url(fonts/roboto-mono-vietnamese.woff2) format("woff2"); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
    :root { --bg: #1d1d1d; --ink: #ececea; --muted: #8b8b87; --pending: #66665f; --line: #2f2f2c; --accent: #7aa5ff; --danger: #fb923c; --font: "Roboto Mono", ui-monospace, monospace; }
    html, body { margin: 0; background: transparent; overflow: hidden; }
    body { font: 13px/1.45 var(--font); color: var(--ink); padding: 6px; }
    .card {
      background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .28); display: grid; gap: 6px;
    }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); cursor: grab; user-select: none; -webkit-user-select: none; }
    .top button { cursor: pointer; }
    .langs { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .src { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    /* your text is cut to two lines; when there's more, click it to see all of it (and click again to fold it) */
    .src.more, .src.open { cursor: pointer; }
    .src.more:hover, .src.open:hover { color: var(--ink); }
    .src.open { display: block; max-height: 180px; overflow-y: auto; white-space: pre-wrap; }
    .out { font-size: 15px; line-height: 1.5; max-height: 220px; overflow-y: auto; overflow-wrap: anywhere; white-space: pre-wrap; }
    .out.pending, .out .pending { color: var(--pending); }
    .out.error { color: var(--danger); font-size: 13px; }
    .roman { font-size: 12px; color: var(--muted); font-style: italic; }
    .roman:empty { display: none; }
    .actions { display: flex; gap: 2px; justify-content: flex-end; border-top: 1px solid var(--line); padding-top: 6px; }
    button { font: inherit; color: var(--muted); background: none; border: 0; cursor: pointer; border-radius: 6px; padding: 4px 8px; font-size: 12px; display: inline-flex; gap: 5px; align-items: center; }
    button:hover, button:focus-visible { background: var(--line); color: var(--ink); outline: none; }
    button svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .close { padding: 2px; }
    /* target language: a button you can Tab to and type into (like the window's language buttons) */
    .to { color: var(--ink); padding: 1px 5px; font-size: 11px; margin-left: 2px; }
    .to::after { content: " ▾"; color: var(--muted); }
    .pick { display: grid; gap: 4px; }
    .pick[hidden] { display: none; }
    .pick input { font: inherit; font-size: 12px; color: var(--ink); background: var(--line); border: 0; border-radius: 6px; padding: 5px 8px; outline: none; }
    .pick-row { padding: 3px 8px; border-radius: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
    .pick-row.active { background: var(--line); color: var(--ink); }
    .back { font-size: 12px; color: var(--muted); }
    .back:empty { display: none; }
    .back::before { content: "↩ "; }
    .match { font-size: 11px; color: var(--muted); }
    .match:empty { display: none; }
    .match b { font-weight: 600; }
    .match.high b { color: var(--accent); }
    .match.mid b { color: var(--ink); }
    .match.low b, .match.unchecked b { color: var(--danger); }
    .match.checking b { color: var(--pending); font-weight: 400; }
    ::highlight(vox-word) { color: var(--accent); background-color: color-mix(in srgb, var(--accent) 18%, transparent); }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="top">
      <span class="langs" translate="no"><span id="langs">translating…</span><button class="to" id="to" hidden aria-haspopup="listbox"></button></span>
      <button class="close" id="close" title="Close (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="src" id="src" translate="no"></div>
    <div class="out pending" id="out" translate="no">…</div>
    <div class="roman" id="roman" translate="no"></div>
    <div class="match" id="match" translate="no"></div>
    <div class="back" id="back" translate="no"></div>
    <div class="pick" id="pick" hidden>
      <input id="pick-q" placeholder="translate into…" spellcheck="false" autocomplete="off" aria-label="Translate into">
      <div id="pick-list" role="listbox"></div>
    </div>
    <div class="actions">
      <button id="speak" title="Read aloud"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>listen</button>
      <button id="copy" title="Copy the translation"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>copy</button>
      <button id="open" title="Open in Vox2"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>open in Vox2</button>
    </div>
  </div>
  <script>
    // A small card next to the cursor. The main window does the translating and sends updates:
    // { session, colors?, langs?, source?, translation?, done?, roman?, error?, status? }
    const T = window.__TAURI__;
    const $ = (id) => document.getElementById(id);
    const card = $('card');
    let session = 0;
    let lastHeight = 0;
    let shown = false;
    let shownAt = 0; // macOS hands the keyboard to the main window for a moment as the bubble opens
    let speaking = false; // reading aloud: Esc stops that first, and only the next Esc closes the bubble
    let stoppedAt = 0;
    // Dragged somewhere by its top bar: it stays there like a sticky note (resizing in place,
    // no longer closing when you click elsewhere) until you close it or a new quick translation starts.
    let pinned = false;
    let dragArmed = 0;  // when you grabbed the top bar
    let placedAt = 0;   // when Vox2 itself last moved it (those moves aren't you dragging)
    const MAC = /Mac/.test(navigator.platform);
    const MOD = MAC ? '⌘' : 'Ctrl+';
    // In the app's language (settings → app language; i18n.js, loaded by the module script below).
    const tr = (s, vars) => (window.VOX_I18N ? window.VOX_I18N.tr(s, vars) : s);
    let uiLang = 'en';
    // The buttons' words and tooltips (with their shortcuts), said again whenever the language changes.
    function labelButtons() {
      label('speak').textContent = speaking ? tr('stop') : tr('listen');
      $('speak').title = speaking ? tr('Stop ({keys} or Esc)', { keys: `${MOD}L` }) : `${tr('Read aloud')} (${MOD}L)`;
      label('copy').textContent = tr('copy');
      $('copy').title = `${tr('Copy the translation')} (${MOD}C)`;
      label('open').textContent = tr('open in Vox2');
      $('open').title = `${tr('Open in Vox2')} (${MOD}O)`;
      $('to').title = tr('Translate into another language (Tab, then type)');
      $('back').title = tr('your text, translated back: what the translation says');
    }
    const label = (id) => $(id).lastChild; // the button's text: "listen", "copy"…

    function place() {
      const h = Math.ceil(card.getBoundingClientRect().height) + 12;
      if (shown && Math.abs(h - lastHeight) < 4) return;
      lastHeight = h;
      if (!shown) shownAt = Date.now();
      shown = true;
      placedAt = Date.now();
      T.core.invoke('place_bubble', { height: h, keep: pinned });
    }
    new ResizeObserver(() => { if (shown) place(); }).observe(card);

    function hide() {
      shown = false;
      T.core.invoke('hide_bubble');
    }

    T.event.listen('bubble', ({ payload: p }) => {
      if (p.session < session) return;
      if (p.session > session) { // new quick translation: reset
        session = p.session;
        shown = false;
        pinned = false;
        $('src').textContent = ''; $('src').classList.remove('open', 'more'); $('roman').textContent = ''; $('match').textContent = ''; $('back').textContent = ''; closePick();
        $('out').textContent = '…'; $('out').className = 'out pending';
        speaking = false; labelButtons();
        startReading(null);
      }
      if (p.ui && p.ui !== uiLang && window.VOX_I18N) {
        uiLang = p.ui;
        window.VOX_I18N.setUiLang(p.ui).then(() => { window.VOX_I18N.translatePage(document.body); labelButtons(); renderPick(); });
      }
      if (p.colors) for (const [k, v] of Object.entries(p.colors)) document.documentElement.style.setProperty(`--${k}`, v);
      if (p.status) { $('langs').textContent = p.status; $('to').hidden = true; }
      if (p.to) { $('langs').textContent = `${p.from} →`; $('to').textContent = p.to; $('to').hidden = false; toCode = p.toCode; }
      else if (p.langs) $('langs').textContent = p.langs;
      if ('match' in p) showMatch(p.match);
      if (p.score) scoreHere(p.session, p.score);
      if (p.source != null) { $('src').textContent = p.source; requestAnimationFrame(markMore); if (MAC) markMore(); }
      if (p.translation != null) { $('out').textContent = p.translation || '…'; $('out').className = p.done ? 'out' : 'out pending'; }
      if (p.roman != null) $('roman').textContent = p.roman;
      if (p.error) { $('out').textContent = p.error; $('out').className = 'out error'; }
      if ('words' in p) startReading(p.words);
      if (p.sayMs != null) clock = { ms: p.sayMs, at: p.sayAt, rate: p.sayRate || 1 };
      if (p.speaking != null) speaking = p.speaking;
      if (p.speaking === false) stoppedAt = Date.now();
      if (p.speaking != null) labelButtons(); // the listen button doubles as stop while reading
      // macOS (WebKit) doesn't run animation frames in a hidden window, and the bubble is hidden
      // until it has placed itself, so measure right away there.
      if (MAC) place(); else requestAnimationFrame(place);
    });

    // Read aloud: the main window sends when each word is spoken ([[ms, from, to], …]) and the
    // playback position every so often; between updates we run the clock forward ourselves.
    const wordMark = new Highlight();
    CSS.highlights.set('vox-word', wordMark);
    let reading = null; // { words, i, node }
    let clock = { ms: 0, at: 0, rate: 1 }; // last known playback position, when it was sent, and the speed
    let looping = false;
    function startReading(words) {
      wordMark.clear();
      if (!words) { reading = null; clock = { ms: -1e9, at: Date.now(), rate: 1 }; return; } // wait for the next position
      reading = { words, i: -1, node: null };
      if (!looping) { looping = true; requestAnimationFrame(follow); }
    }
    function follow() {
      const r = reading;
      if (!r) { looping = false; return; }
      const ms = clock.ms + (Date.now() - clock.at) * clock.rate;
      let i = -1;
      while (i + 1 < r.words.length && r.words[i + 1][0] <= ms) i++;
      const node = $('out').firstChild;
      if ((i !== r.i || node !== r.node) && node?.nodeType === Node.TEXT_NODE) {
        r.i = i;
        r.node = node;
        wordMark.clear();
        const [, from, to] = r.words[i] || [];
        if (i >= 0 && to <= node.length) {
          const range = document.createRange();
          range.setStart(node, from);
          range.setEnd(node, to);
          wordMark.add(range);
        }
      }
      requestAnimationFrame(follow);
    }

    // Your text, folded to two lines: mark it clickable only when there's more to see.
    function markMore() {
      const src = $('src');
      if (src.classList.contains('open')) return;
      const more = src.scrollHeight > src.clientHeight + 1;
      src.classList.toggle('more', more);
      src.title = more ? 'Show all of your text' : '';
    }
    $('src').addEventListener('click', () => {
      const src = $('src');
      if (!src.classList.contains('more') && !src.classList.contains('open')) return;
      if (getSelection().toString()) return; // selecting text in it, not clicking
      const open = src.classList.toggle('open');
      src.title = open ? 'Fold your text' : 'Show all of your text';
    });

    const act = (action) => T.event.emitTo('main', 'bubble-action', { action });
    $('speak').addEventListener('click', () => act('speak'));
    $('open').addEventListener('click', () => { act('open'); hide(); });
    $('close').addEventListener('click', hide);
    $('copy').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText($('out').textContent); } catch {}
      label('copy').textContent = tr('copied');
      setTimeout(() => { label('copy').textContent = tr('copy'); }, 900);
    });
    // Match score, worked out here (the main window is usually hidden, and macOS slows hidden
    // windows down). The same check as the window's badge; gives up after 30 s rather than
    // saying "checking…" for good.
    const TIER_NOTE = { high: () => tr('meaning kept'), mid: () => tr('check the details'), low: () => tr('likely off') };
    async function scoreHere(forSession, { original, translation, back, lang, target }) {
      const current = () => forSession === session;
      if (!window.VOX_SCORE) return;
      const { untranslated, matchScore, tier } = window.VOX_SCORE;
      if (untranslated(original, translation)) return showMatch({ label: tr("can't check"), tier: 'unchecked', note: tr('part of it came through untranslated') });
      showMatch({ label: tr('checking…'), tier: 'checking', note: '' });
      $('back').textContent = '';
      const giveUp = setTimeout(() => { if (current()) showMatch(null); }, 30000);
      try {
        const { score } = await matchScore(original, back, lang, target);
        if (current()) {
          showMatch({ label: tr('{n}% match', { n: score }), tier: tier(score), note: TIER_NOTE[tier(score)]() });
          // Below "meaning kept", show what came back, so the number has its reason next to it.
          $('back').textContent = score < 85 ? back : '';
        }
      } catch {
        if (current()) showMatch(null); // no model (e.g. offline the first time): leave the score out
      } finally {
        clearTimeout(giveUp);
      }
    }

    // Match score, as in the window: "92% match · meaning kept", or "can't check".
    function showMatch(m) {
      const el = $('match');
      el.className = `match ${m?.tier || ''}`;
      el.replaceChildren();
      if (!m) return;
      const b = document.createElement('b');
      b.textContent = m.label;
      el.append(b, m.note ? ` · ${m.note}` : '');
    }

    // Translate into another language from the keyboard: Tab to the language (or just start typing
    // anywhere in the bubble), type a few letters, Enter or Tab picks. Esc closes the list first.
    let toCode = '';
    let picks = [];
    let active = 0;
    const pick = $('pick');
    const q = $('pick-q');
    function rankLangs(text) {
      const t = text.trim().toLowerCase();
      // Names in the app's language, findable by their English names too.
      const shown = ([code, name]) => (window.VOX_I18N ? window.VOX_I18N.langLabel(code, name) : name);
      const all = (window.VOX_LANGS || []).filter(([code]) => code !== toCode).map((l) => [l[0], shown(l), l[1]]);
      if (!t) return all.slice(0, 6);
      const rank = ([code, name, english]) => {
        const best = (n) => {
          n = n.toLowerCase();
          if (code.toLowerCase() === t || n.startsWith(t)) return 0;
          if (n.split(/[\s(]+/).some((w) => w.startsWith(t))) return 1;
          return n.includes(t) ? 2 : -1;
        };
        const r = [best(name), best(english)].filter((x) => x >= 0);
        return r.length ? Math.min(...r) : -1;
      };
      return all.map((l) => [l, rank(l)]).filter(([, r]) => r >= 0).sort((a, b) => a[1] - b[1]).slice(0, 6).map(([l]) => l);
    }
    function renderPick() {
      picks = rankLangs(q.value);
      active = Math.min(active, Math.max(0, picks.length - 1));
      $('pick-list').replaceChildren(...picks.map(([code, name], i) => {
        const row = document.createElement('div');
        row.className = `pick-row${i === active ? ' active' : ''}`;
        row.setAttribute('role', 'option');
        row.textContent = name;
        row.addEventListener('pointerdown', (e) => { e.preventDefault(); choose(code); });
        return row;
      }));
    }
    function openPick(typed = '') {
      if ($('to').hidden) return;
      pick.hidden = false;
      q.value = typed;
      active = 0;
      renderPick();
      q.focus();
    }
    function closePick() {
      if (pick.hidden) return;
      pick.hidden = true;
      if (!$('to').hidden) $('to').focus();
    }
    function choose(code) {
      closePick();
      if (!code || code === toCode) return;
      $('out').textContent = '…'; $('out').className = 'out pending'; showMatch(null); $('back').textContent = '';
      T.event.emitTo('main', 'bubble-action', { action: 'lang', code });
    }
    $('to').addEventListener('click', () => (pick.hidden ? openPick() : closePick()));
    q.addEventListener('input', () => { active = 0; renderPick(); });
    q.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') active = Math.min(active + 1, picks.length - 1);
      else if (e.key === 'ArrowUp') active = Math.max(active - 1, 0);
      else if (e.key === 'Enter' || (e.key === 'Tab' && q.value.trim())) return e.preventDefault(), choose(picks[active]?.[0]);
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); return closePick(); }
      else return;
      e.preventDefault();
      renderPick();
    });
    // Shortcuts, like the window's (⌘ on Mac, Ctrl on Windows): L listen / stop, C copy, O open in
    // Vox2. They show in the buttons' tooltips.
    labelButtons();
    addEventListener('keydown', (e) => {
      if (!(MAC ? e.metaKey : e.ctrlKey) || e.altKey || e.shiftKey) return;
      const id = { KeyL: 'speak', KeyC: 'copy', KeyO: 'open' }[e.code];
      if (!id || (id === 'copy' && getSelection().toString())) return; // copying text you selected in the bubble: let it
      e.preventDefault();
      $(id).click();
    });

    // Tab goes round the bubble's own buttons (language, listen, copy, open, close) and wraps,
    // Shift+Tab backwards, instead of leaving the bubble for the main window. While the language
    // list is open, Tab picks from it (above).
    addEventListener('keydown', (e) => {
      if (e.key !== 'Tab' || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
      const stops = [...card.querySelectorAll('button, input')].filter((el) => !el.disabled && el.getClientRects().length && !el.closest('[hidden]'))
        .sort((a, b) => (a.id === 'close') - (b.id === 'close')); // close last
      if (!stops.length) return;
      const i = stops.indexOf(document.activeElement);
      const next = i < 0 ? (e.shiftKey ? stops.length - 1 : 0) : (i + (e.shiftKey ? -1 : 1) + stops.length) % stops.length;
      e.preventDefault();
      stops[next].focus();
    });

    // Typing a letter anywhere else in the bubble (or on the language button) starts the search.
    addEventListener('keydown', (e) => {
      if (e.target === q || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key.length === 1 && /\p{L}/u.test(e.key)) { e.preventDefault(); openPick(e.key); }
      else if (e.target === $('to') && e.key === 'ArrowDown') { e.preventDefault(); openPick(); }
    });

    // Esc: while reading aloud, just stop reading; otherwise put the bubble away. (Esc anywhere also
    // reaches the main window, which may stop the reading a moment before this sees the key: treat
    // a stop in the last half second as this Esc's.)
    addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      act('stop');
      if (!speaking && Date.now() - stoppedAt > 500) hide();
    });
    // Click anywhere else and it goes away (but not for the moment macOS takes the keyboard as it opens),
    // unless you've moved it: then it stays like a sticky note until × or Esc.
    addEventListener('blur', () => { if (shown && !pinned && Date.now() - shownAt > 1000) hide(); });

    // Press and hold the top bar to move it (not on its buttons). It only counts as moved when the
    // window moves within a few seconds of grabbing it and not because Vox2 placed it, so a plain
    // click on the bar doesn't pin it.
    $('card').querySelector('.top').addEventListener('mousedown', (e) => {
      if (e.button !== 0 || e.target.closest('button, input')) return;
      e.preventDefault();
      dragArmed = Date.now();
      T.window.getCurrentWindow().startDragging().catch(() => {});
    });
    T.window.getCurrentWindow().onMoved(() => {
      if (pinned || !dragArmed || Date.now() - dragArmed > 3000 || Date.now() - placedAt < 400) return;
      pinned = true;
      act('pinned');
    });

    T.event.emitTo('main', 'bubble-ready');
  </script>
  <script type="module">
    // The language list for "translate into…" (same names as the window's menus).
    import { LANGUAGES } from './languages.js';
    import { tr, setUiLang, translatePage, langLabel } from './i18n.js';
    window.VOX_I18N = { tr, setUiLang, translatePage, langLabel };
    import { matchScore, tier } from './meaning.js';
    import { untranslated } from './meaning-checks.js';
    window.VOX_LANGS = LANGUAGES;
    window.VOX_SCORE = { matchScore, tier, untranslated };
  </script>
</body>
</html>
