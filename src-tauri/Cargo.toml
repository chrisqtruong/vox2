[package]
name = "vox2"
version = "0.4.10"
description = "Vox2: a lightweight two-way translator with live dictation"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"  # opening Vox2 again just brings the running one forward
tauri-plugin-updater = "2"  # updates from GitHub releases (signed)
tauri-plugin-process = "2"  # restart after an update
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.6"  # types dictated text into the app you're in; sends Ctrl+C to grab a selection
arboard = "3"  # clipboard, to read the grabbed selection and put back what was there
xcap = "0.9"   # screen capture for snip & translate
image = { version = "0.25", default-features = false, features = ["png"] }
# read-aloud: WebSocket client for Microsoft's neural voices
tungstenite = { version = "0.30", features = ["native-tls"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
# API keys in Windows Credential Manager / macOS Keychain instead of settings.json
keyring = { version = "3", features = ["windows-native", "apple-native"] }
# total and free memory, so the voice model is held for less time on smaller machines
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

# Small, fast release binary.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# System-wide keyboard watcher (shortcuts from any app). On macOS, rdev 0.5 reads the keyboard
# layout off the main thread on every keypress, which macOS 14+ kills the app for; RustDesk's
# fork can hand that lookup to the main thread (see hotkey::start). Pinned to a known commit, and
# named rdev_mac because Cargo needs one source per dependency name.
[target.'cfg(not(target_os = "macos"))'.dependencies]
rdev = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
rdev_mac = { package = "rdev", git = "https://github.com/rustdesk-org/rdev", rev = "a361d86a8b0245f3618a9efb375c149530a6b599" }
# permission checks for the setup sheet (permissions.rs)
core-foundation = "0.9"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
