[package]
name = "vox2"
version = "0.4.15"
description = "Vox2: a lightweight two-way translator with live dictation"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"  # opening Vox2 again just brings the running one forward
tauri-plugin-updater = "2"  # updates from GitHub releases (signed)
tauri-plugin-process = "2"  # restart after an update
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.6"  # types dictated text into the app you're in; sends Ctrl+C to grab a selection
arboard = "3"  # clipboard, to read the grabbed selection and put back what was there
xcap = "0.9"   # screen capture for snip & translate
image = { version = "0.25", default-features = false, features = ["png"] }
# read-aloud: WebSocket client for Microsoft's neural voices
tungstenite = { version = "0.30", features = ["native-tls"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
# API keys in Windows Credential Manager / macOS Keychain instead of settings.json
keyring = { version = "3", features = ["windows-native", "apple-native"] }
# total and free memory, so the voice model is held for less time on smaller machines
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

# Small, fast release binary.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# System-wide keyboard watcher (shortcuts from any app). macOS has its own in hotkey.rs: rdev's
# looks up the keyboard layout on every key, which crashes off the main thread and, when slow,
# gets the watcher switched off by macOS.
[target.'cfg(not(target_os = "macos"))'.dependencies]
rdev = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
# permission checks (permissions.rs), the keyboard watcher (hotkey.rs), window fade (main.rs)
core-foundation = "0.9"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSData"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
