[package]
name = "vox2"
version = "0.4.2"
description = "Vox2: a lightweight two-way translator with live dictation"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"  # opening Vox2 again just brings the running one forward
tauri-plugin-updater = "2"  # updates from GitHub releases (signed)
tauri-plugin-process = "2"  # restart after an update
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = "0.5"   # system-wide keyboard watcher (shortcuts from any app)
enigo = "0.6"  # types dictated text into the app you're in; sends Ctrl+C to grab a selection
arboard = "3"  # clipboard, to read the grabbed selection and put back what was there
xcap = "0.9"   # screen capture for snip & translate
image = { version = "0.25", default-features = false, features = ["png"] }
# read-aloud: WebSocket client for Microsoft's neural voices
tungstenite = { version = "0.30", features = ["native-tls"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

# Small, fast release binary.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
